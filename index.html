<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Clegg</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --link: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #eaeaea;
      --muted: #999999;
      --link: #6ea8ff;
    }
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  main {
    max-width: 28rem;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }
  p.tagline {
    color: var(--muted);
    margin: 0 0 1.5rem;
  }
  ul.links {
    list-style: none;
    padding: 0;
    margin: 0 0 2rem;
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
  }
  ul.links a {
    color: var(--link);
    text-decoration: none;
  }
  ul.links a:hover {
    text-decoration: underline;
  }
  footer {
    font-size: 0.8rem;
    color: var(--muted);
  }
  footer a {
    color: inherit;
  }
</style>
</head>
<body>
<main>
  <h1>Thomas Clegg</h1>
  <p class="tagline">Software engineer, Austin, TX.</p>
  <ul class="links">
    <li><a href="https://github.com/twcclegg">GitHub</a></li>
    <li><a href="mailto:support@clegg.dev">Email</a></li>
  </ul>
  <footer>
    <a href="/privacy">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
